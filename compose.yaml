services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: ws-mosquitto
    restart: unless-stopped
    ports:
      - "1886:1883"
      - "9004:9001"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - ws-network

  postgresql:
    image: postgres:18-alpine
    container_name: ws-postgresql
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD:-postgres123}
      - WS_DB_NAME=${WS_DB_NAME:-weather}
      - WS_DB_USER=${WS_DB_USER:-weather_user}
      - WS_DB_PASSWORD=${WS_DB_PASSWORD:-weather_password}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - ./config/postgresql:/docker-entrypoint-initdb.d
    networks:
      - ws-network

  mqtt-ws3802:
    build: ./mqtt-ws3802
    container_name: ws-mqtt-ws3802
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_CLIENT_ID=mqtt_ws3802_logger
      - MQTT_TOPIC_PREFIX=ecowitt/#
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_NAME=${WS_DB_NAME:-weather}
      - DB_USER=${WS_DB_USER:-weather_user}
      - DB_PASSWORD=${WS_DB_PASSWORD:-weather_password}
      - LOG_LEVEL=INFO
    networks:
      - ws-network
    depends_on:
      - mosquitto
      - postgresql

volumes:
  mosquitto-data:
  mosquitto-log:
  postgresql-data:

networks:
  ws-network:
    driver: bridge
